<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidade sobre Tecnologia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8f0fe;
            padding: 50px;
        }

        h1 {
            color: #1a73e8;
        }

        .mensagem {
            font-size: 20px;
            color: #333;
            margin: 30px;
        }

        .botao {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .botao:hover {
            background-color: #1557b0;
        }
    </style>
</head>

<body>

    <h1>Curiosidade sobre Tecnologia 💻</h1>

    <p class="mensagem">
        Clique no botão para descobrir uma curiosidade!
    </p>

    <button class="botao">Mostrar curiosidade</button>

    <script>
        const botao = document.querySelector(".botao");
        const mensagem = document.querySelector(".mensagem");

        function mostrarMensagem() {
            mensagem.textContent =
                "Você sabia? O primeiro computador eletrônico ocupava uma sala inteira! 🤯";
        }

        botao.addEventListener("click", mostrarMensagem);
    </script>

</body>
</html>
